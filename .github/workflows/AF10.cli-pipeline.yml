name: AF10 CI Pipeline

on:
  push:
    branches:
      - AF10

  workflow_dispatch:
    inputs:
      log_errors:
        description: "Generate error logs if tests fail?"
        required: true
        default: "false"

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests and capture logs
        run: |
          pytest -q 2>&1 | tee test.log
        continue-on-error: true

      - name: Upload logs if tests failed AND log_errors = true
        if: failure() && github.event.inputs.log_errors == 'true'
        uses: actions/upload-artifact@v3
        with:
          name: test-error-logs
          path: test.log

      - name: Fail job if tests actually failed
        if: failure()
        run: |
          echo "Tests failed!"
          exit 1

  build:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-crypto-app:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/devops-crypto-app:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure App Service (simulated)
        run: |
          echo "Docker image pushed to DockerHub!"
          echo "Here the Azure Web App deployment would happen."
