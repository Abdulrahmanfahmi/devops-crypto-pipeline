name: CI Pipeline

on:
  push:
    branches:
      - AF10
  workflow_dispatch:
    inputs:
      run_tests:
        type: boolean
        description: "Run tests?"
        default: true
      log_errors:
        type: boolean
        description: "Create error artifact if tests fail?"
        default: true

jobs:

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        id: runtests
        continue-on-error: true
        run: pytest -q

      - name: Upload error logs
        if: failure() && github.event.inputs.log_errors == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-error-log
          path: .
          retention-days: 5

      - name: Fail if tests failed
        if: steps.runtests.outcome == 'failure'
        run: |
          echo "Tests failed. Stopping pipeline."
          exit 1

  build:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-crypto-app:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/devops-crypto-app:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure (simulated)
        run: |
          echo "Docker image pushed to DockerHub!"
          echo "Here we would deploy to Azure App Service using the pushed image."